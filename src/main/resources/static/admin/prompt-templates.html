<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10233f">
    <title>提示词管理 · GEO 管理平台</title>
    <link rel="stylesheet" href="./styles.css?v=20261021-login1">
    <link rel="stylesheet" href="./styles/components.css?v=20261031-takeover1">
    <link rel="stylesheet" href="./styles/forms.css?v=20261017-layout4">
    <link rel="stylesheet" href="./prompt-templates.css?v=20261119-prompt1">
    <script src="./shared/navigation.js?v=20261119-prompt1" defer></script>
    <script src="./shared/browser-takeover.js?v=20261101-replay1" defer></script>
</head>
<body class="standard-page">
<div class="app-shell">
    <aside class="sidebar" aria-label="主导航" data-admin-navigation></aside>
    <div class="main-area">
        <header class="topbar"><div class="breadcrumb" aria-label="当前位置"></div><div class="topbar-label">管理平台</div></header>
        <main class="content">
            <div class="page-heading"><div><p class="eyebrow">BASIC CONFIGURATION</p><h1>提示词管理</h1><p class="page-description">维护各步骤发给模型的提示词。保存会新增一个版本，旧版本保留，载入后再保存即可回滚。</p></div></div>
            <section class="list-panel prompt-panel" aria-label="提示词编辑">
                <div class="panel-heading prompt-toolbar">
                    <label class="form-field prompt-select"><span>提示词</span><select id="prompt-key"><option value="">正在加载…</option></select></label>
                    <p id="prompt-version-note" class="prompt-version-note"></p>
                </div>
                <p id="prompt-error" class="notice notice-error" role="alert" hidden></p>
                <p id="prompt-success" class="notice notice-loading" role="status" hidden></p>
                <div class="prompt-layout">
                    <div class="prompt-editor">
                        <textarea id="prompt-content" spellcheck="false" aria-label="提示词内容" disabled></textarea>
                        <p class="prompt-help">制题与诊断报告的提示词规定了模型返回的 JSON 格式，要和程序解析对得上：改错了，制题会直接报错，报告会在对应步骤暂停，改回后重新生成或点重试即可。保存后下一次调用就用新版本；诊断报告的判定提示词例外：报告开始判定时记下所用版本，续跑沿用这一版，手动重判时换成最新版。</p>
                        <div class="form-actions"><button type="button" class="refresh-button" id="reset-prompt" disabled>放弃修改</button><button type="button" class="primary-button" id="save-prompt" disabled>保存为新版本</button></div>
                    </div>
                    <aside class="prompt-side" aria-label="可用变量与历史版本">
                        <h2>可用变量</h2>
                        <p class="prompt-help">在提示词里写成 {{变量名}}，执行时填入对应数据；只能用下面列出的变量，标“必填”的不能删掉。</p>
                        <table class="prompt-variables"><thead><tr><th scope="col">变量</th><th scope="col">说明</th></tr></thead><tbody id="prompt-variables"></tbody></table>
                        <h2>历史版本</h2>
                        <ol id="prompt-versions" class="prompt-versions"></ol>
                    </aside>
                </div>
            </section>
        </main>
    </div>
</div>
<script src="./shared/http.js?v=20261029-failure1"></script>
<script src="./prompt-templates.js?v=20261119-prompt1"></script>
</body>
</html>
